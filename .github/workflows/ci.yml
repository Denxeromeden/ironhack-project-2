name: CI Build, Scan & Push

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "gitops/**"
  push:
    branches: [main]
    paths-ignore:
      - "gitops/**"
  workflow_dispatch:
    inputs:
      force_build_all:
        description: Build all three images regardless of changed paths
        required: false
        type: boolean
        default: false

permissions: {}

# Keep main pushes in order. queue:max prevents a newer merge from replacing an
# already-pending run and silently losing an image build. PRs use their own queue.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      services: ${{ steps.detect.outputs.services }}
      has_images: ${{ steps.detect.outputs.has_images }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect changed services
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          FORCE_BUILD_ALL: ${{ inputs.force_build_all || false }}
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files.txt"
          : > "$changed_files"

          if [[ "$FORCE_BUILD_ALL" == "true" ]]; then
            printf 'vote\nresult\nworker\n' > "$RUNNER_TEMP/services.txt"
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > "$changed_files"
            elif [[ "$EVENT_NAME" == "push" && -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
              git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$changed_files"
            elif git rev-parse HEAD^ >/dev/null 2>&1; then
              git diff --name-only HEAD^ HEAD > "$changed_files"
            fi

            : > "$RUNNER_TEMP/services.txt"
            while IFS= read -r path; do
              case "$path" in
                vote/*) echo vote >> "$RUNNER_TEMP/services.txt" ;;
                result/*) echo result >> "$RUNNER_TEMP/services.txt" ;;
                worker/*) echo worker >> "$RUNNER_TEMP/services.txt" ;;
              esac
            done < "$changed_files"
          fi

          sort -u "$RUNNER_TEMP/services.txt" -o "$RUNNER_TEMP/services.txt"
          services_json="$(jq -Rsc 'split("\n") | map(select(length > 0))' "$RUNNER_TEMP/services.txt")"
          echo "services=$services_json" >> "$GITHUB_OUTPUT"
          if [[ "$services_json" == "[]" ]]; then
            echo "has_images=false" >> "$GITHUB_OUTPUT"
            echo "No application service paths changed; image build/push jobs will be skipped."
          else
            echo "has_images=true" >> "$GITHUB_OUTPUT"
            echo "Services selected for build: $services_json"
          fi

  lint:
    # Lint is currently advisory: report violations but do not block image publishing.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned lint tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

          HADOLINT_VERSION=2.14.0
          curl -fsSLo "$RUNNER_TEMP/hadolint" "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          chmod +x "$RUNNER_TEMP/hadolint"
          install "$RUNNER_TEMP/hadolint" "$RUNNER_TEMP/bin/hadolint"

          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          curl -fsSLo "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          install "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/bin/actionlint"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          hadolint --version
          actionlint -version
      - name: Lint Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          hadolint vote/Dockerfile result/Dockerfile worker/Dockerfile
      - name: Lint GitHub Actions workflows
        run: |
          # actionlint v1.7.12 predates GitHub's `concurrency.queue: max` schema support.
          # Ignore the queue schema diagnostic only; GitHub validates workflow syntax.
          actionlint -color -ignore 'queue'

  sonarqube-cloud:
    name: SonarCloud (Python, Node.js and IaC)
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache SonarCloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ hashFiles('.sonar-project.properties') }}
          restore-keys: sonar-${{ runner.os }}-
      - name: Analyze Python, Node.js, Helm, Terraform and workflow code
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=false

  sonar-dotnet-worker:
    name: SonarCloud (.NET worker)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && contains(fromJSON(needs.detect-changes.outputs.services), 'worker') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}-worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install pinned SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner --version 12.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Begin SonarCloud analysis
        run: >-
          dotnet sonarscanner begin
          /k:"${SONAR_PROJECT_KEY}"
          /o:"${SONAR_ORGANIZATION}"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${SONAR_TOKEN}"
          /d:sonar.qualitygate.wait=false
      - name: Build under SonarScanner
        run: dotnet build Worker.csproj --configuration Release
      - name: End SonarCloud analysis
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  fork-pr-notice:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    permissions:
      contents: read
    steps:
      - name: Explain skipped Sonar analysis
        run: echo "SonarCloud was skipped for this fork PR because secrets are not provided to untrusted forks. Lint and Trivy checks still run."

  trivy-fs:
    name: Trivy filesystem, secrets and misconfiguration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_VERSION: 0.76.1
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.ci-cache/trivy-cache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ci-cache/trivy-cache
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-fs-${{ github.run_id }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-
      - name: Install pinned Trivy binary
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          mkdir -p "$RUNNER_TEMP/bin"
          install "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/bin/trivy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          trivy --version
      - name: Validate ignore policy
        shell: bash
        run: |
          python3 - .trivyignore <<'PY'
          import datetime as dt
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          if not path.is_file():
              print(f"::error::Missing Trivy ignore policy: {path}")
              raise SystemExit(1)

          reason = ""
          expiry = ""
          errors = []
          active = 0
          for number, raw in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
              line = raw.strip()
              if not line:
                  continue
              if line.startswith("#"):
                  comment = line[1:].strip()
                  if comment.lower().startswith("reason:"):
                      reason = comment.split(":", 1)[1].strip()
                  elif comment.lower().startswith("expires:"):
                      expiry = comment.split(":", 1)[1].strip()
                  continue

              active += 1
              if not reason:
                  errors.append(f"{path}:{number}: missing preceding '# reason: ...'")
              if not expiry:
                  errors.append(f"{path}:{number}: missing preceding '# expires: YYYY-MM-DD'")
              else:
                  try:
                      if dt.date.fromisoformat(expiry) <= dt.date.today():
                          errors.append(f"{path}:{number}: exception expired on {expiry}")
                  except ValueError:
                      errors.append(f"{path}:{number}: invalid expiry date {expiry!r}")
              reason = ""
              expiry = ""

          if errors:
              print("\n".join(errors), file=sys.stderr)
              raise SystemExit(1)
          print(f"Trivy ignore policy valid ({active} active exception(s)).")
          PY
      - name: Generate all-severity SARIF report
        run: |
          trivy fs \
            --cache-dir "$TRIVY_CACHE_DIR" \
            --config trivy.yaml \
            --scanners vuln,secret,misconfig \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output "$RUNNER_TEMP/trivy-fs.sarif" \
            --exit-code 0 \
            .
      - name: Stage filesystem SARIF report for upload
        run: |
          mkdir -p .ci-reports
          cp "$RUNNER_TEMP/trivy-fs.sarif" .ci-reports/trivy-fs.sarif
      - name: Upload filesystem findings to GitHub Code Scanning
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: .ci-reports/trivy-fs.sarif
          category: trivy-filesystem
      - name: Fail on fixable HIGH or CRITICAL findings
        run: |
          trivy fs \
            --cache-dir "$TRIVY_CACHE_DIR" \
            --config trivy.yaml \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 0 \
            .

  build-images:
    name: Build ${{ matrix.service }} (linux/arm64)
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.has_images == 'true' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build ARM64 image and save Docker archive
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker buildx version
          build_args=(
            --platform linux/arm64
            --tag "${SERVICE}:${IMAGE_TAG}"
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          )
          if [[ "$SERVICE" == "vote" ]]; then
            build_args+=(--target final)
          fi
          docker buildx build "${build_args[@]}" \
            --output "type=docker,dest=${RUNNER_TEMP}/${SERVICE}.tar" \
            "$SERVICE"
          test -s "${RUNNER_TEMP}/${SERVICE}.tar"
      - name: Upload image archive for scanning and publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-${{ matrix.service }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar
          if-no-files-found: error
          retention-days: 1

  scan-images:
    name: Trivy image scan
    needs: [detect-changes, build-images]
    if: ${{ needs.detect-changes.outputs.has_images == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      TRIVY_VERSION: 0.76.1
      TRIVY_CACHE_DIR: ${{ github.workspace }}/.ci-cache/trivy-cache
      SERVICES_JSON: ${{ needs.detect-changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the exact image archives built by the previous job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*-${{ github.sha }}
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Cache Trivy vulnerability database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ci-cache/trivy-cache
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-image-${{ github.run_id }}
          restore-keys: |
            trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}-
      - name: Install pinned Trivy binary
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          mkdir -p "$RUNNER_TEMP/bin"
          install "$RUNNER_TEMP/trivy" "$RUNNER_TEMP/bin/trivy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          trivy --version
      - name: Generate SARIF for every selected image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/image-sarif"
          while IFS= read -r service; do
            [[ -n "$service" ]] || continue
            archive="$RUNNER_TEMP/images/${service}.tar"
            test -s "$archive" || { echo "Missing archive for $service: $archive" >&2; exit 1; }
            trivy image --input "$archive" \
              --cache-dir "$TRIVY_CACHE_DIR" \
              --ignorefile .trivyignore \
              --scanners vuln,secret \
              --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --ignore-unfixed \
              --format sarif \
              --output "$RUNNER_TEMP/image-sarif/${service}.sarif" \
              --exit-code 0
          done < <(jq -r '.[]' <<< "$SERVICES_JSON")
          python3 - "$RUNNER_TEMP/image-sarif" "$RUNNER_TEMP/trivy-images.sarif" <<'PY'
          import json, pathlib, sys
          folder, output = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          reports = [json.loads(p.read_text()) for p in sorted(folder.glob('*.sarif'))]
          if not reports:
              raise SystemExit('No image SARIF reports were generated')
          merged = dict(reports[0])
          merged['runs'] = [run for report in reports for run in report.get('runs', [])]
          output.write_text(json.dumps(merged, separators=(',', ':')))
          print(f'Merged {len(reports)} image report(s) into {output}')
          PY
      - name: Stage image SARIF report for upload
        run: |
          mkdir -p .ci-reports
          cp "$RUNNER_TEMP/trivy-images.sarif" .ci-reports/trivy-images.sarif
      - name: Upload image findings to GitHub Code Scanning
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: .ci-reports/trivy-images.sarif
          category: trivy-images
      - name: Fail on fixable HIGH or CRITICAL image vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r service; do
            [[ -n "$service" ]] || continue
            echo "Enforcing HIGH/CRITICAL vulnerability gate for $service"
            trivy image --input "$RUNNER_TEMP/images/${service}.tar" \
              --cache-dir "$TRIVY_CACHE_DIR" \
              --ignorefile .trivyignore \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format table \
              --exit-code 0
          done < <(jq -r '.[]' <<< "$SERVICES_JSON")

  push-images:
    name: Push scanned images to ECR
    needs: [detect-changes, build-images, scan-images, lint, sonarqube-cloud, sonar-dotnet-worker, trivy-fs]
    if: >-
      ${{
        always() &&
        needs.detect-changes.outputs.has_images == 'true' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        needs.build-images.result == 'success' &&
        needs.scan-images.result == 'success' &&
        needs.sonarqube-cloud.result == 'success' &&
        (needs.sonar-dotnet-worker.result == 'success' || needs.sonar-dotnet-worker.result == 'skipped') &&
        needs.trivy-fs.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      UNIQUE_ID: ${{ vars.UNIQUE_ID }}
      ENV_TAG: ${{ vars.ENV_TAG }}
      SERVICES_JSON: ${{ needs.detect-changes.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the scanned image archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: image-*-${{ github.sha }}
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ECR_PUSH }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to ECR and push immutable SHA tags
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"
          while IFS= read -r service; do
            [[ -n "$service" ]] || continue
            repository="${UNIQUE_ID}-${ENV_TAG}-${service}"
            archive="$RUNNER_TEMP/images/${service}.tar"
            test -s "$archive" || { echo "Missing scanned image archive: $archive" >&2; exit 1; }
            docker load --input "$archive"
            local_image="${service}:${GITHUB_SHA}"
            remote_image="${REGISTRY}/${repository}:${GITHUB_SHA}"
            docker image inspect "$local_image" >/dev/null
            if aws ecr describe-images --region "$AWS_REGION" --repository-name "$repository" --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
              echo "${remote_image} already exists; immutable tag will not be overwritten."
              continue
            fi
            docker tag "$local_image" "$remote_image"
            docker push "$remote_image"
          done < <(jq -r '.[]' <<< "$SERVICES_JSON")

  bump-tag:
    name: Update GitOps image tags
    needs: [detect-changes, push-images]
    if: ${{ needs.detect-changes.outputs.has_images == 'true' && needs.push-images.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: voting-app-image-tag-bump
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      SERVICES_JSON: ${{ needs.detect-changes.outputs.services }}
      TAG: ${{ github.sha }}
    steps:
      - name: Checkout latest main with tag-bot token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TAG_BOT_PAT }}
          ref: main
          fetch-depth: 0
      - name: Install pinned yq
        run: |
          set -euo pipefail
          YQ_VERSION=4.45.4
          curl -fsSLo "$RUNNER_TEMP/yq" "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          chmod +x "$RUNNER_TEMP/yq"
          mkdir -p "$RUNNER_TEMP/bin"
          install "$RUNNER_TEMP/yq" "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          yq --version
      - name: Bump only the images built in this run
        shell: bash
        run: |
          set -euo pipefail
          VALUES_FILE="gitops/voting-app/values.yaml"
          test -f "$VALUES_FILE" || { echo "::error::Expected file missing: $VALUES_FILE"; find gitops -maxdepth 3 -type f -name values.yaml -print; exit 1; }
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          apply_tags() {
            while IFS= read -r service; do
              [[ -n "$service" ]] || continue
              current_tag="$(SERVICE="$service" yq -r '.[strenv(SERVICE)].image.tag // ""' "$VALUES_FILE")"
              # A faster later workflow can reach this serialized job before an older
              # one. Never roll a service back to an ancestor commit tag.
              if [[ "$current_tag" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${current_tag}^{commit}" 2>/dev/null; then
                if git merge-base --is-ancestor "$TAG" "$current_tag"; then
                  echo "Keeping ${service} at newer/current tag ${current_tag}; not rolling it back to ${TAG}."
                  continue
                fi
              fi
              SERVICE="$service" TAG="$TAG" yq -i '.[strenv(SERVICE)].image.tag = strenv(TAG)' "$VALUES_FILE"
              echo "Setting ${service}.image.tag=${TAG}"
            done < <(jq -r '.[]' <<< "$SERVICES_JSON")
          }

          apply_tags
          if git diff --quiet -- "$VALUES_FILE"; then
            echo "All selected image tags are already current; no GitOps commit is needed."
            exit 0
          fi

          git add "$VALUES_FILE"
          git commit -m "chore(gitops): update voting-app image tags [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "GitOps image tags updated."
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Could not push tag update after 5 attempts. Check TAG_BOT_PAT permissions and the main ruleset bypass."
              exit 1
            fi
            echo "Push raced with another main update; refresh main and reapply only these tags (attempt ${attempt}/5)."
            git fetch origin main
            git reset --hard origin/main
            apply_tags
            git add "$VALUES_FILE"
            if git diff --cached --quiet; then
              echo "Another run already applied these image tags."
              exit 0
            fi
            git commit -m "chore(gitops): update voting-app image tags [skip ci]"
          done
