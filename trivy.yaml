# Shared Trivy defaults. Findings are informational for now; workflows may override format.
format: table
exit-code: 0
ignorefile: .trivyignore
severity:
  - HIGH
  - CRITICAL
scan:
  scanners:
    - vuln
    - secret
    - misconfig
  skip-dirs:
    - .git
    - node_modules
    - .terraform
vulnerability:
  ignore-unfixed: true
