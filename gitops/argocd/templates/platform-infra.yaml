apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: '{{ .Values.repoURL }}'
    targetRevision: '{{ .Values.targetRevision }}'
    path: gitops/platform-infra
    helm:
      parameters:
        - name: namePrefix
          value: "{{ .Values.namePrefix }}"
        - name: envTag
          value: "{{ .Values.envTag }}"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true