ngf:
  fullnameOverride: nginx-gateway-fabric
  nginxGateway:
    gatewayClassName: nginx
  service:
    type: LoadBalancer

aws-lb-controller:
  serviceAccount:
    create: true
    name: aws-load-balancer-controller

external-secrets:
  installCRDs: true
  namespaceOverride: external-secrets
  fullnameOverride: external-secrets
  serviceAccount:
    create: true
    name: external-secrets

cert-manager:
  installCRDs: true
  namespaceOverride: cert-manager
  fullnameOverride: cert-manager
  serviceAccount:
    create: true
    name: cert-manager
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    gatewayAPI:
      enabled: true

external-dns:
  provider: aws
  sources:
    - gateway-httproute
  policy: sync
  txtOwnerId: "{{ .Values.clusterName }}"
  domainFilters:
    - "{{ .Values.baseDomain }}"
  aws:
    zoneType: public
  serviceAccount:
    create: true
    name: external-dns

  cloudnative-pg:

  headlamp:
  service:
    type: ClusterIP
    port: 80