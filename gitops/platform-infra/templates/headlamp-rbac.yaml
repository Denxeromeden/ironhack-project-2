apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  namespace: platform-infra
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer-binding
subjects:
- kind: ServiceAccount
  name: headlamp-viewer
  namespace: platform-infra
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io