apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote
  labels:
    {{- include "voting-app.labels" (dict "root" . "name" "vote") | nindent 4 }}
spec:
  replicas: {{ .Values.vote.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "voting-app.selectorLabels" (dict "root" . "name" "vote") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voting-app.selectorLabels" (dict "root" . "name" "vote") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        {{- include "voting-app.topologySpread" (dict "root" . "name" "vote") | nindent 8 }}
      containers:
        - name: vote
          image: {{ include "voting-app.image" (dict "root" . "service" "vote" "tag" .Values.vote.image.tag) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.vote.port }}
              protocol: TCP
          env:
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: VOTING_MODE
              value: {{ .Values.global.votingMode | quote }}
            - name: OPTION_A
              value: {{ .Values.vote.optionA | quote }}
            - name: OPTION_B
              value: {{ .Values.vote.optionB | quote }}
          resources:
            {{- toYaml .Values.vote.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
          volumeMounts:
            - name: app-home
              mountPath: /home/app
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: app-home
          emptyDir:
            sizeLimit: 32Mi
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vote
  labels:
    {{- include "voting-app.labels" (dict "root" . "name" "vote") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "voting-app.selectorLabels" (dict "root" . "name" "vote") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.vote.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    {{- include "voting-app.labels" (dict "root" . "name" "result") | nindent 4 }}
spec:
  replicas: {{ .Values.result.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "voting-app.selectorLabels" (dict "root" . "name" "result") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voting-app.selectorLabels" (dict "root" . "name" "result") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        {{- include "voting-app.topologySpread" (dict "root" . "name" "result") | nindent 8 }}
      containers:
        - name: result
          image: {{ include "voting-app.image" (dict "root" . "service" "result" "tag" .Values.result.image.tag) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.result.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.result.port | quote }}
            - name: PG_HOST
              value: postgres-r
            - name: PG_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-app-credentials
                  key: password
            - name: PG_DATABASE
              value: {{ .Values.postgres.database | quote }}
          resources:
            {{- toYaml .Values.result.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
