name: CI Build, Scan & Push

on:
  push:
    branches: [main]
    paths-ignore:
      - 'gitops/**'
      - 'terraform/**'
      - 'README.md'

  pull_request:
    branches: [main]
    paths-ignore:
      - 'gitops/**'
      - 'terraform/**'
      - 'README.md'

  workflow_dispatch:
    inputs:
      force_build_all:
        description: 'Force build all services'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    outputs:
      services: ${{ steps.matrix.outputs.services }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01

      - name: Filter changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3 
        with:
          filters: |
            vote:
              - 'vote/**'
            result:
              - 'result/**'
            worker:
              - 'worker/**'

      - name: Build service matrix
        id: matrix
        env:
          CHANGED_SERVICES: ${{ steps.filter.outputs.changes }}
          FORCE_BUILD_ALL: ${{ inputs.force_build_all }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${FORCE_BUILD_ALL:-false}" == "true" ]]; then
            services='["vote","result","worker"]'
          else
            services="${CHANGED_SERVICES:-[]}"
          fi

          echo "Services selected: $services"
          echo "services=$services" >> "$GITHUB_OUTPUT"

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    # Standard GitHub-hosted ARM64 runners are available for public
    # repositories. Private repositories may require an ARM64 larger runner.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          target: ${{ matrix.service == 'vote' && 'final' || '' }}
          platforms: linux/arm64
          load: true
          tags: ${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Export image as tar artifact
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/artifacts
          docker save "${SERVICE}:${TAG}" \
            -o "/tmp/artifacts/${SERVICE}.tar"

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: /tmp/artifacts/${{ matrix.service }}.tar
          retention-days: 1
          if-no-files-found: error

  scan:
    needs: [detect-changes, build]
    if: ${{ needs.detect-changes.outputs.services != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2 
        with:
          name: image-${{ matrix.service }}
          path: /tmp/artifacts

      - name: Load image into Docker
        env:
          SERVICE: ${{ matrix.service }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker load -i "/tmp/artifacts/${SERVICE}.tar"
          docker image inspect "${SERVICE}:${TAG}" >/dev/null

      - name: Run Trivy vulnerability scanner
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: '${{ matrix.service }}:${{ github.sha }}'
          format: sarif
          output: trivy-results-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          exit-code: '0'

      - name: Check for SARIF output
        id: sarif
        if: always()
        env:
          SARIF_FILE: trivy-results-${{ matrix.service }}.sarif
        run: |
          if [[ -s "$SARIF_FILE" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Do not attempt a security-events upload on pull_request runs,
      # where the token may not have write access (e.g. forked PRs).
      - name: Upload Trivy scan results
        if: ${{ always() && github.event_name != 'pull_request' && steps.sarif.outputs.exists == 'true' }}
        uses: github/codeql-action/upload-sarif@0fda7a646fd14a20daf520829ca1ae8847000819 # v4.39.1
        with:
          sarif_file: trivy-results-${{ matrix.service }}.sarif

  push:
    needs: [detect-changes, build, scan]

    # Manual publishing is permitted only when explicitly dispatched on main.
    if: >-
      ${{
        needs.detect-changes.outputs.services != '[]' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.service }}
          path: /tmp/artifacts

      - name: Assume AWS OIDC role for ECR push
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          # This secret must contain the bootstrap ecr_push_role_arn output.
          role-to-assume: ${{ secrets.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Load and push image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          SERVICE: ${{ matrix.service }}
          TAG: ${{ github.sha }}
          UNIQUE_ID: ${{ vars.UNIQUE_ID }}
          ENV_TAG: ${{ vars.ENV_TAG }}
        shell: bash
        run: |
          set -euo pipefail

          : "${UNIQUE_ID:?GitHub variable UNIQUE_ID is required}"
          : "${ENV_TAG:?GitHub variable ENV_TAG is required}"

          docker load -i "/tmp/artifacts/${SERVICE}.tar"

          # Must match terraform/bootstrap/main.tf:
          # name = "${local.name_prefix}-${each.key}"
          REPOSITORY="${UNIQUE_ID}-${ENV_TAG}-${SERVICE}"
          IMAGE="${REGISTRY}/${REPOSITORY}:${TAG}"

          # Immutable tags: never overwrite a previously published image.
          if aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=${TAG}" >/dev/null 2>&1; then
            echo "Image already exists: ${IMAGE}; skipping push."
            exit 0
          fi

          docker tag "${SERVICE}:${TAG}" "$IMAGE"
          docker push "$IMAGE"

          echo "Published ${IMAGE}"

  bump-tag:
    needs: [detect-changes, push]

    if: >-
      ${{
        needs.detect-changes.outputs.services != '[]' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      SERVICES_JSON: ${{ needs.detect-changes.outputs.services }}
      TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        uses: mikefarah/yq@504fc38780cc46be8444ea1b72fb55919fc0bfb0 #v4.54.1

      - name: Diagnose values file path
        run: |
          echo "Checked-out commit: $(git rev-parse HEAD)"
          echo "GitHub ref: $GITHUB_REF"
          echo "Tracked values.yaml files:"
          git ls-files 'gitops/**/values.yaml'
          echo "GitOps directories:"
          find gitops -maxdepth 4 -type d -print

      - name: Update only the built service image tags
        shell: bash
        run: |
          set -euo pipefail

          VALUES_FILE="${GITHUB_WORKSPACE}/gitops/voting-app/values.yaml"

          while IFS= read -r service; do
            case "$service" in
              vote|result|worker) ;;
              *)
                echo "Unexpected service in matrix: $service" >&2
                exit 1
                ;;
            esac
            echo "Working directory: $(pwd)"
            echo "Values file: ${VALUES_FILE}"
            ls -la "$(dirname "$VALUES_FILE")"
            test -f "$VALUES_FILE" || {
              echo "::error::Values file not found: $VALUES_FILE"
              exit 1
            }
            echo "Setting ${service}.image.tag=${TAG}"
            SERVICE="$service" \
              yq eval -i \
                '.[strenv(SERVICE)].image.tag = strenv(TAG)' \
                "$VALUES_FILE"
          done < <(jq -r '.[]' <<< "$SERVICES_JSON")

      - name: Commit and push tag updates
        shell: bash
        run: |
          set -euo pipefail

          VALUES_FILE="${GITHUB_WORKSPACE}/gitops/voting-app/values.yaml"

          if git diff --quiet -- "$VALUES_FILE"; then
            echo "No image tag changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$VALUES_FILE"

          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi

          git commit -m "chore(gitops): update voting-app image tags [skip ci]"
          git push