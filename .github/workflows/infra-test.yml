name: Terraform Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

jobs:
  plan:
    if: github.event.inputs.action == 'plan'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/infra
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_unique_id: ${{ vars.UNIQUE_ID }}
      TF_VAR_env_tag: ${{ vars.ENV_TAG }}
      TF_VAR_zone_name: ${{ vars.ZONE_NAME }}
      TF_VAR_additional_cluster_admins: ${{ secrets.ADDITIONAL_CLUSTER_ADMINS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1
      - name: Debug OIDC claims
        env:
          AUDIENCE: sts.amazonaws.com
        run: |
          set -euo pipefail

          TOKEN_JSON=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")

          ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')

          TOKEN="$ID_TOKEN" python3 - <<'PY'
          import os
          import json
          import base64

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          keys = [
              "iss", "aud", "sub",
              "repository", "repository_id",
              "repository_owner", "repository_owner_id",
              "ref", "event_name"
          ]

          print(json.dumps(
              {key: claims.get(key) for key in keys},
              indent=2
          ))
          PY
      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=../backend.conf

      - name: Execute Plan
        run: terraform plan

  apply:
    if: github.event.inputs.action == 'apply'
    runs-on: ubuntu-latest
    environment: infra-apply
    defaults:
      run:
        working-directory: terraform/infra
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_unique_id: ${{ vars.UNIQUE_ID }}
      TF_VAR_env_tag: ${{ vars.ENV_TAG }}
      TF_VAR_zone_name: ${{ vars.ZONE_NAME }}
      TF_VAR_additional_cluster_admins: ${{ secrets.ADDITIONAL_CLUSTER_ADMINS }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=../backend.conf

      - name: Execute Apply
        run: terraform apply -auto-approve

  destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: infra-destroy
    defaults:
      run:
        working-directory: terraform/infra
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_unique_id: ${{ vars.UNIQUE_ID }}
      TF_VAR_env_tag: ${{ vars.ENV_TAG }}
      TF_VAR_zone_name: ${{ vars.ZONE_NAME }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=../backend.conf

      - name: Execute Teardown Script
        run: ./down.sh "$TF_VAR_unique_id" "$TF_VAR_env_tag"
