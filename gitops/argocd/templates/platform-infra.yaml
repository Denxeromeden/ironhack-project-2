apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-infra
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: '{{ .Values.repoURL }}'
    targetRevision: '{{ .Values.targetRevision }}'
    path: gitops/platform-infra
    helm:
      parameters:
        - name: namePrefix
          value: "{{ .Values.namePrefix }}"
        - name: envTag
          value: "{{ .Values.envTag }}"
        - name: "aws-lb-controller.clusterName"
          value: "{{ .Values.clusterName }}"
        - name: "aws-lb-controller.region"
          value: "{{ .Values.region }}"
        - name: "aws-lb-controller.vpcId"
          value: "{{ .Values.vpcId }}"
        - name: zoneId
          value: "{{ .Values.zoneId }}"
        - name: acmeEmail
          value: "{{ .Values.acmeEmail }}"
        - name: acmeIssuer
          value: "{{ .Values.acmeIssuer }}"
        - name: external-dns.txtOwnerId
          value: "{{ .Values.clusterName }}"
        - name: "external-dns.domainFilters[0]"
          value: "{{ .Values.zoneName }}"
        - name: region
          value: "{{ .Values.region }}"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true