# Main SonarCloud project scans Python, Node.js, Terraform, Helm/YAML, Dockerfiles and scripts.
# The .NET worker is analyzed separately by SonarScanner for .NET in ci.yml.
sonar.sources=vote,result,terraform,gitops,healthchecks,.github
sonar.exclusions=**/node_modules/**,**/.terraform/**,**/charts/*.tgz,gitops/platform-infra/templates/gateway-api-crds.yaml,**/package-lock.json,**/*.sarif,worker/**
sonar.sourceEncoding=UTF-8
