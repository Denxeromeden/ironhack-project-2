{{- $baseDomain := required "global.baseDomain must be injected by Argo CD" .Values.global.baseDomain -}}
{{- range $name := list "vote" "result" }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  labels:
    {{- include "voting-app.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ $.Values.gateway.name | quote }}
      namespace: {{ $.Values.gateway.namespace | quote }}
      sectionName: {{ $.Values.gateway.httpsSectionName | quote }}
  hostnames:
    - {{ printf "%s.%s" $name $baseDomain | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ $name }}
          port: {{ if eq $name "vote" }}{{ $.Values.vote.port }}{{ else }}{{ $.Values.result.port }}{{ end }}
          kind: Service
          group: ""
{{- end }}
