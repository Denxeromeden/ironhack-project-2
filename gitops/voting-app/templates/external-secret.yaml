apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app-credentials
  labels:
    {{- include "voting-app.labels" (dict "root" . "name" "postgres-app-credentials") | nindent 4 }}
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: postgres-app-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          # CNPG watches this label and applies password rotations promptly.
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: {{ printf "%s-postgres-app" (required "global.namePrefix must be injected by Argo CD" .Values.global.namePrefix) | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ printf "%s-postgres-app" (required "global.namePrefix must be injected by Argo CD" .Values.global.namePrefix) | quote }}
        property: password
