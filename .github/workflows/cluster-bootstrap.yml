name: Cluster bootstrap Pipeline

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Choose action'
        required: true
        default: 'plan'
        type: choice
        options:
          - apply-prerequisite
          - apply-full
          - destroy

jobs:
  apply-prerequisite:
    if: github.event.inputs.action == 'apply-prerequisite'
    runs-on: ubuntu-latest
    environment: infra-apply
    defaults:
      run:
        working-directory: terraform/cluster-bootstrap
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_unique_id: ${{ vars.UNIQUE_ID }}
      TF_VAR_env_tag: ${{ vars.ENV_TAG }}
      TF_VAR_zone_name: ${{ vars.ZONE_NAME }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=../backend.conf

      - name: Execute Apply
        run: terraform apply -target=helm_release.argocd -auto-approve
  
  apply-full:
    if: github.event.inputs.action == 'apply-full'
    runs-on: ubuntu-latest
    environment: infra-apply
    defaults:
      run:
        working-directory: terraform/cluster-bootstrap
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_unique_id: ${{ vars.UNIQUE_ID }}
      TF_VAR_env_tag: ${{ vars.ENV_TAG }}
      TF_VAR_zone_name: ${{ vars.ZONE_NAME }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=../backend.conf

      - name: Execute Apply
        run: terraform apply -auto-approve

  destroy:
    if: github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    environment: infra-destroy
    defaults:
      run:
        working-directory: terraform/cluster-bootstrap
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_unique_id: ${{ vars.UNIQUE_ID }}
      TF_VAR_env_tag: ${{ vars.ENV_TAG }}
      TF_VAR_zone_name: ${{ vars.ZONE_NAME }}
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.01

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e #v4.0.1

      - name: Setup AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd #v6.3.0
        with:
          role-to-assume: ${{ secrets.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config=../backend.conf

      - name: Execute Teardown
        run: terraform destroy -auto-approve
